# Noctalia Theme for Mango
# Generated automatically by Noctalia

root_color = 0x131318ff
border_color = 0x908f9cff
drop_color = 0xcacdff80
split_color = 0xffbcefff
focus_color = 0xcacdffff
maximized_screen_color = 0xc2c4e7ff
urgent_color = 0xffb4abff
scratchpad_color = 0xffbcefff
global_color = 0xa8afffff
overlay_color = 0x444764ff
jump_label_decorate_fg_color = 0xe4e1e8ff
jump_label_decorate_bg_color = 0x2a292fff
jump_label_decorate_focus_fg_color = 0x212870ff
jump_label_decorate_focus_bg_color = 0xcacdffff
jump_label_decorate_border_color = 0x908f9cff
group_bar_decorate_fg_color = 0xe4e1e8ff
group_bar_decorate_bg_color = 0x2a292fff
group_bar_decorate_focus_fg_color = 0x212870ff
group_bar_decorate_focus_bg_color = 0xcacdffff
group_bar_decorate_border_color = 0x908f9cff

# lock screen
bind=SUPER,Escape,spawn, noctalia msg session lock

# Noctalia Keybindings via noctalia-client
bind = SUPER, space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, s, spawn, noctalia msg panel-toggle control-center
bind = SUPER, comma, spawn, noctalia msg setting-toggle [context]

# audio
binds=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
binds=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
binds=NONE,XF86AudioMute,spawn,noctalia msg volume-mute

# brightness
binds=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
binds=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Screenshots
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=SHIFT,Print,spawn,noctalia msg screenshot-window
bind=CTRL,Print,spawn,noctalia msg screenshot-fullscreen

# cheatsheet
bind=SUPER+SHIFT,slash,spawn,noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet
