# -*- conf -*-
# Foot configuration matching default Kitty aesthetics and behavior

[main]
shell=/usr/bin/zsh
# Use JetBrainsMono Nerd Font with medium weight and size 11
font=JetBrainsMono Nerd Font:size=11:weight=medium
font-bold=JetBrainsMono Nerd Font:size=11:weight=bold
font-italic=JetBrainsMono Nerd Font:size=11:weight=medium:slant=italic
font-bold-italic=JetBrainsMono Nerd Font:size=11:weight=bold:slant=italic

# Enable gamma correction for color blending to make colors look vibrant (not washed out/dull)
gamma-correct-blending=yes

# Set terminal identification to xterm-256color so shell syntax highlighting maps colors correctly
term=xterm-256color

# Window Padding (matching window_padding_width 10 in kitty.conf)
pad=10x10

# Selection copy behavior (matches copy_on_select yes in kitty.conf)
selection-target=both

# Render bold text using bright colors for better contrast (less dull)
bold-text-in-bright=yes

[scrollback]
# Matches scrollback_lines 3000 in kitty.conf
lines=3000

[cursor]
# Blinking block cursor matching kitty defaults
style=block
blink=yes

[csd]
# Matches hide_window_decorations yes in kitty.conf
preferred=none
size=0
border-width=0

[bell]
# Matches enable_audio_bell no in kitty.conf
urgent=yes
notify=no
visual=no

[key-bindings]
# Spawn a new terminal window (matches ctrl+shift+n in kitty.conf)
spawn-terminal=Control+Shift+n

# Font zoom adjustments (matches kitty defaults)
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[colors-dark]
# Background color: set to 000000 for pure black, or 141312 for the exact Kitty dank-theme background
background=000000
# background=141312
# Custom foreground, selection, and url colors matching dank-theme.conf
foreground=e6e1df
selection-foreground=34302b
selection-background=cec5be
urls=d3c4b6
# Custom cursor text and background color (matching dank-theme.conf)
cursor=cfc5bb e6e1df
alpha=1.0

# 16-color ANSI palette matching kitty's dank-theme.conf
regular0=141312  # black
regular1=f2746d  # red
regular2=7bd369  # green
regular3=ffe672  # yellow
regular4=c8b7a7  # blue
regular5=615449  # magenta
regular6=d3c4b6  # cyan
regular7=ddd6d0  # white

bright0=89837e   # bright black
bright1=ffa49f   # bright red
bright2=b3fda4   # bright green
bright3=ffefa5   # bright yellow
bright4=e8dacc   # bright blue
bright5=fff2e6   # bright magenta
bright6=fff6ef   # bright cyan
bright7=fffbf8   # bright white
